seed: 42
data:
  dir: ../Data files/new_data
  glob: sigma_*_mass_*_dTb.npz
  z_min: 5.1
  z_max: 1000.0
  n_grid: 400
split:
  train: 0.7
  val: 0.15
  test: 0.15
  keep_boundary_in_train: true
transform:
  asinh_scale_mK: 1.0
reducer:
  variance_to_keep: 0.9999
  max_components: 30
curve_forest:
  n_estimators: 800
  selection_trees: 300
  max_features:
    sigma:
    - 0.02
    - 0.05
    - 0.12
    mass:
    - 0.1
    - 0.3
    - 0.5
    - 1.0
forward:
  n_restarts: 2
  nu: 2.5
inference:
  grid_per_axis: 121
  posterior_noise: 0.05
  refit_on_train_val: true
  candidates:
    rf:
    - min_samples_leaf: 1
    - min_samples_leaf: 2
    extra_trees:
    - min_samples_leaf: 1
    knn:
    - n_neighbors: 1
    - n_neighbors: 3
      weights: distance
    - n_neighbors: 5
      weights: distance
    mlp:
    - hidden_layer_sizes:
      - 128
      - 128
      alpha: 0.0001
    - hidden_layer_sizes:
      - 64
      - 64
      alpha: 0.01
    - hidden_layer_sizes:
      - 64
      - 64
      alpha: 0.001
      solver: lbfgs
      max_iter: 2000
evaluation:
  sigma_bins:
  - -43
  - -42
  - -41
  - -39
  noise_levels:
  - 0.0
  - 0.05
  - 0.2
